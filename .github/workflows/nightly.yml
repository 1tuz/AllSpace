name: Nightly

# Heavy checks that are too slow for every PR: the board interaction regression
# pass and the bundle size baseline. The required PR gates live in ci.yml and are
# not weakened by this workflow; a nightly failure is a signal, not a merge
# blocker.
#
# The full WebDriver tier (exec + port-forward through the real app) is NOT here
# yet: its flow still drives the removed vault gate and classic sidebar, so it
# fails before reaching the app. TODO P0.9 tracks the repair; this job returns
# once that flow reaches the board.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full
  cancel-in-progress: false

jobs:
  board-regression:
    name: board regression
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Widget interaction suite (hover, pin, collapse, profile switch)
        run: pnpm --filter @srelens/desktop exec vitest run src/workspace --reporter=verbose
      - name: Bundle size baseline
        run: node --test scripts/perf/size-baseline.test.mjs
