<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="allspace-architecture-title allspace-architecture-desc" id="allspace-architecture-root">
          <title id="allspace-architecture-title">AllSpace architecture</title>
          <desc id="allspace-architecture-desc">Architecture diagram of the React workspace, Tauri and axum hosts, MCP server and TUI, shared capability registry, delivery model and correlation, provider adapters, and Kubernetes access.</desc>
          <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #allspace-architecture-root { --color-paper:  #2d3142;
      --color-paper-2:#393e53;
      --color-ink:    #f5f5f5;
      --color-muted:  #bfc0c0;
      --color-soft:   #8e98ac;
      --color-accent: #f08a59;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace; }
      #allspace-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }</style>
            <marker id="allspace-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
            <marker id="allspace-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
            <marker id="allspace-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
          </defs>

          <rect width="100%" height="100%" fill="#2d3142"/>

          <!-- Title, inside the SVG so the exported README image carries it. -->
          <text x="40" y="32" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ARCHITECTURE · ALLSPACE</text>
          <text x="40" y="64" fill="#f5f5f5" font-size="28" font-weight="400" font-family="'Instrument Serif', serif" letter-spacing="-0.02em">AllSpace architecture</text>

          <!-- Arrows first: connections sit behind every node. -->
          <line x1="200" y1="192" x2="200" y2="256" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#allspace-architecture-arrow)"/>
          <line x1="360" y1="304" x2="440" y2="304" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#allspace-architecture-arrow)"/>
          <path d="M 360,464 H 392 Q 400,464 400,456 V 328 Q 400,320 408,320 H 440" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#allspace-architecture-arrow)"/>
          <path d="M 760,280 H 792 Q 800,280 800,272 V 152 Q 800,144 808,144 H 840" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#allspace-architecture-arrow)"/>
          <line x1="760" y1="304" x2="840" y2="304" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#allspace-architecture-arrow)"/>
          <path d="M 760,328 H 792 Q 800,328 800,336 V 456 Q 800,464 808,464 H 840" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#allspace-architecture-arrow)"/>
          <line x1="1000" y1="192" x2="1000" y2="256" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#allspace-architecture-arrow)"/>

          <!-- Node: Workspace UI -->
          <rect x="40" y="96" width="320" height="96" rx="6" fill="#2d3142"/>
          <rect x="40" y="96" width="320" height="96" rx="6" fill="#393e53" stroke="#bfc0c0" stroke-width="1"/>
          <rect x="52" y="108" width="24" height="12" rx="2" fill="none" stroke="#bfc0c0" stroke-opacity="0.50" stroke-width="0.8"/>
          <text x="64" y="117" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
          <text x="200" y="144" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Workspace UI</text>
          <text x="200" y="164" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">React 19 · @srelens/core</text>
          <text x="200" y="180" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">My Work · Trace · Kubernetes</text>

          <!-- Node: Application hosts -->
          <rect x="40" y="256" width="320" height="96" rx="6" fill="#2d3142"/>
          <rect x="40" y="256" width="320" height="96" rx="6" fill="#393e53" stroke="#bfc0c0" stroke-width="1"/>
          <rect x="52" y="268" width="32" height="12" rx="2" fill="none" stroke="#bfc0c0" stroke-opacity="0.50" stroke-width="0.8"/>
          <text x="68" y="277" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
          <text x="200" y="304" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Application hosts</text>
          <text x="200" y="324" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Tauri desktop · axum web</text>
          <text x="200" y="340" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">commands + events · IPC / HTTP / WS</text>

          <!-- Node: MCP server and TUI -->
          <rect x="40" y="416" width="320" height="96" rx="6" fill="#2d3142"/>
          <rect x="40" y="416" width="320" height="96" rx="6" fill="#393e53" stroke="#bfc0c0" stroke-width="1"/>
          <rect x="52" y="428" width="28" height="12" rx="2" fill="none" stroke="#bfc0c0" stroke-opacity="0.50" stroke-width="0.8"/>
          <text x="66" y="437" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
          <text x="200" y="464" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP server &amp; TUI</text>
          <text x="200" y="484" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">crates/mcp · apps/tui</text>
          <text x="200" y="500" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stdio + loopback HTTP</text>

          <!-- Node: Shared capability registry (focal) -->
          <rect x="440" y="256" width="320" height="96" rx="6" fill="#2d3142"/>
          <rect x="440" y="256" width="320" height="96" rx="6" fill="#f08a59" fill-opacity="0.10" stroke="#f08a59" stroke-width="1"/>
          <rect x="452" y="268" width="32" height="12" rx="2" fill="none" stroke="#f08a59" stroke-opacity="0.50" stroke-width="0.8"/>
          <text x="468" y="277" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
          <text x="600" y="304" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Capability registry</text>
          <text x="600" y="324" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">crates/capability · crates/registry</text>
          <text x="600" y="340" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared by desktop, web, and MCP</text>

          <!-- Node: Delivery model and correlation (focal) -->
          <rect x="840" y="96" width="320" height="96" rx="6" fill="#2d3142"/>
          <rect x="840" y="96" width="320" height="96" rx="6" fill="#f08a59" fill-opacity="0.10" stroke="#f08a59" stroke-width="1"/>
          <rect x="852" y="108" width="32" height="12" rx="2" fill="none" stroke="#f08a59" stroke-opacity="0.50" stroke-width="0.8"/>
          <text x="868" y="117" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOIN</text>
          <text x="1000" y="144" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Delivery model &amp; correlation</text>
          <text x="1000" y="164" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">anchors · evidence · confidence</text>
          <text x="1000" y="180" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Trace · sourceErrors · partial</text>

          <!-- Node: Provider adapters -->
          <rect x="840" y="256" width="320" height="96" rx="6" fill="#2d3142"/>
          <rect x="840" y="256" width="320" height="96" rx="6" fill="#393e53" stroke="#bfc0c0" stroke-width="1"/>
          <rect x="852" y="268" width="24" height="12" rx="2" fill="none" stroke="#bfc0c0" stroke-opacity="0.50" stroke-width="0.8"/>
          <text x="864" y="277" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
          <text x="1000" y="304" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Provider adapters</text>
          <text x="1000" y="324" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Jira · GitLab · Bitbucket · Jenkins</text>
          <text x="1000" y="340" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">external provider APIs</text>

          <!-- Node: Kubernetes access -->
          <rect x="840" y="416" width="320" height="96" rx="6" fill="#2d3142"/>
          <rect x="840" y="416" width="320" height="96" rx="6" fill="#393e53" stroke="#bfc0c0" stroke-width="1"/>
          <rect x="852" y="428" width="28" height="12" rx="2" fill="none" stroke="#bfc0c0" stroke-opacity="0.50" stroke-width="0.8"/>
          <text x="866" y="437" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">K8S</text>
          <text x="1000" y="464" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kubernetes access</text>
          <text x="1000" y="484" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">crates/kube · crates/streams</text>
          <text x="1000" y="500" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">watches · logs · exec · port-forward · Helm</text>

          <!-- Legend strip -->
          <line x1="40" y1="568" x2="1240" y2="568" stroke="#f5f5f5" stroke-opacity="0.12" stroke-width="0.8"/>
          <text x="40" y="584" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

          <rect x="120" y="576" width="16" height="12" rx="2" fill="#f08a59" fill-opacity="0.10" stroke="#f08a59" stroke-width="1"/>
          <text x="144" y="584" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif">Focal: registry and join path</text>

          <rect x="360" y="576" width="16" height="12" rx="2" fill="#393e53" stroke="#bfc0c0" stroke-width="1"/>
          <text x="384" y="584" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif">Shared upstream infrastructure</text>

          <line x1="680" y1="582" x2="708" y2="582" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#allspace-architecture-arrow)"/>
          <text x="716" y="584" fill="#bfc0c0" font-size="9" font-family="'Geist', sans-serif">Dependency, not network topology</text>

          <!-- Footer notes -->
          <text x="40" y="624" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace">Integration modules only: Jira, GitLab, Bitbucket, Jenkins, and the Kubernetes API are external services.</text>
          <text x="40" y="640" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace">Arrows show dependencies, not a full network topology. LLM providers, plugins, and CI are omitted.</text>
        </svg>
