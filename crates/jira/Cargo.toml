[package]
name = "srelens-jira"
version.workspace = true
edition.workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
srelens-devops-model = { path = "../devops-model" }
srelens-devops-profiles = { path = "../devops-profiles" }
srelens-capability = { path = "../capability" }
schemars = "0.8"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
