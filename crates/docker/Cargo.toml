[package]
name = "srelens-docker"
version.workspace = true
edition.workspace = true

[dependencies]
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
srelens-capability = { path = "../capability" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
