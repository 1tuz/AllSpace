name: Desktop builds

# Unsigned, downloadable CI artifacts for the canonical SmallSpace repository.
# This workflow publishes NOTHING: no GitHub release, no container image, no
# Homebrew/AUR push. Stable releases remain in release.yml, which is gated to
# the original srelens/srelens repository.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR runs supersede each other; pushes keep a per-commit group so every merge
# to main gets its own artifacts (same rule as ci.yml).
concurrency:
  group: desktop-build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin a supported Apple Silicon image instead of a moving latest.
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            target_args: --target aarch64-apple-darwin
            bundles: app,dmg
          - name: Linux x86_64
            runner: ubuntu-22.04
            target: ''
            target_args: ''
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri v2 build dependencies (same set as ci.yml's backend job).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.* \
                     /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            build-essential \
            curl wget file

      # Same pinned linuxdeploy as release.yml: the bundler's own download is
      # rolling, and the Wayland exclusion only exists in this release.
      - name: Seed linuxdeploy (Linux)
        if: runner.os == 'Linux'
        env:
          LINUXDEPLOY_RELEASE: "1-alpha-20251107-1"
          LINUXDEPLOY_SHA256: "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d"
        run: |
          mkdir -p ~/.cache/tauri
          curl -fsSL --retry 3 --retry-all-errors -o ~/.cache/tauri/linuxdeploy-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_RELEASE}/linuxdeploy-x86_64.AppImage"
          echo "${LINUXDEPLOY_SHA256}  $HOME/.cache/tauri/linuxdeploy-x86_64.AppImage" | sha256sum -c -
          chmod +x ~/.cache/tauri/linuxdeploy-x86_64.AppImage

      # No `version:` — package.json's `packageManager` is the only source.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile

      # `createUpdaterArtifacts` is off for these builds: the updater signature
      # needs a private key this repository does not have, and CI must not
      # invent one. The result is a normal unsigned app for local testing.
      - name: Build unsigned desktop bundles
        env:
          LINUXDEPLOY_EXCLUDED_LIBRARIES: "libwayland-*"
        run: >-
          pnpm tauri build
          --bundles ${{ matrix.bundles }}
          ${{ matrix.target_args }}
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # A .app is a directory; upload-artifact would hand back a folder, not a
      # double-clickable bundle. Zip it as a bundle, and keep the dmg too.
      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "target/aarch64-apple-darwin/release/bundle/macos/srelens.app"
          "srelens-macos-arm64.app.zip"

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srelens-desktop-macos-arm64
          path: |
            srelens-macos-arm64.app.zip
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srelens-desktop-linux-x86_64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
