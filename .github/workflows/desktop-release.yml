name: Desktop release

# Publishes installable desktop bundles as a GitHub Release for THIS repository
# (1tuz/AllSpace). release.yml is gated to the original upstream repository and
# is skipped here; desktop-build.yml only uploads short-lived CI artifacts. This
# workflow is the one that actually ships.
#
# Tag shape: v<X.Y.Z>, and <X.Y.Z> MUST equal `version` in
# apps/desktop/src-tauri/tauri.conf.json. The `verify` job fails the run before
# anything is built if the two disagree, so a tag can never publish bundles
# stamped with a different version than the release title claims.
on:
  push:
    tags: ['v*']
  # Dispatched from a tag ref (Actions UI: "Run workflow" -> branch/tag picker
  # -> the tag). A dispatch from a branch ref fails in `verify`.
  workflow_dispatch:

# Read-only by default; only the job that publishes declares `contents: write`
# for itself, so a job added later starts without write access.
permissions:
  contents: read

# Never cancel an in-flight release: a half-uploaded release is worse than a
# late one. Keyed on the tag so two different tags can still build in parallel.
concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Gate: the tag and the app's declared version must agree. Runs before the
  # (expensive) build matrix, so a mismatched tag costs seconds, not an hour.
  verify:
    name: Verify tag matches app version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare tag with tauri.conf.json
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *)
              echo "::error::desktop-release must run from a tag ref (v<X.Y.Z>), got '${GITHUB_REF}'. Re-dispatch it from the tag."
              exit 1
              ;;
          esac
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF_VERSION="$(python3 -c "import json; print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")"
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' implies version '${TAG_VERSION}', but apps/desktop/src-tauri/tauri.conf.json declares '${CONF_VERSION}'. Bump the version in tauri.conf.json (and retag) so the two match."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches tauri.conf.json version ${CONF_VERSION}."

  build:
    name: ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pin a supported Apple Silicon image instead of a moving latest.
          - name: macOS Apple Silicon
            runner: macos-15
            artifact: srelens-release-macos-arm64
            target: aarch64-apple-darwin
            target_args: --target aarch64-apple-darwin
            bundles: app,dmg
          - name: Linux x86_64
            runner: ubuntu-22.04
            artifact: srelens-release-linux-x86_64
            target: ''
            target_args: ''
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri v2 build dependencies (same set as desktop-build.yml / ci.yml).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.* \
                     /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            build-essential \
            curl wget file

      # Same pinned linuxdeploy as desktop-build.yml: the bundler's own download
      # is rolling, and the Wayland exclusion only exists in this release.
      - name: Seed linuxdeploy (Linux)
        if: runner.os == 'Linux'
        env:
          LINUXDEPLOY_RELEASE: "1-alpha-20251107-1"
          LINUXDEPLOY_SHA256: "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d"
        run: |
          mkdir -p ~/.cache/tauri
          curl -fsSL --retry 3 --retry-all-errors -o ~/.cache/tauri/linuxdeploy-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_RELEASE}/linuxdeploy-x86_64.AppImage"
          echo "${LINUXDEPLOY_SHA256}  $HOME/.cache/tauri/linuxdeploy-x86_64.AppImage" | sha256sum -c -
          chmod +x ~/.cache/tauri/linuxdeploy-x86_64.AppImage

      # No `version:` — package.json's `packageManager` is the only source.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile

      # `createUpdaterArtifacts` is forced off: the updater signature needs a
      # private key this repository does not have, and CI must not invent one.
      # These are normal unsigned bundles.
      - name: Build unsigned desktop bundles
        env:
          LINUXDEPLOY_EXCLUDED_LIBRARIES: "libwayland-*"
        run: >-
          pnpm tauri build
          --bundles ${{ matrix.bundles }}
          ${{ matrix.target_args }}
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # Only the publishable bundles travel to the publish job: a .dmg, a .deb
      # and an .AppImage, each under the name Tauri gave it.
      - name: Upload macOS bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  # Publishes the release and then reads it back from the API: a green build job
  # that produced no installable asset is the failure this job exists to catch.
  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          # download-artifact keeps the layout each upload-artifact saw. The
          # Linux upload matches two globs under target/release/bundle, so its
          # files arrive as deb/… and appimage/…, not flat in dist/. Collect
          # recursively and never assume a depth.
          FILES=()
          while IFS= read -r -d '' file; do
            FILES+=("$file")
          done < <(find dist -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no .dmg/.deb/.AppImage found in the downloaded artifacts"
            ls -lR dist
            exit 1
          fi
          echo "About to upload to ${TAG} in ${GITHUB_REPOSITORY}:"
          ls -l "${FILES[@]}"
          # Refuse to publish a release that is missing a platform: an install
          # one-liner that resolves to a release without its asset is worse
          # than no release at all.
          for ext in dmg deb AppImage; do
            if ! printf '%s\n' "${FILES[@]}" | grep -q "\.${ext}$"; then
              echo "::error::the build produced no .${ext}; refusing to publish ${TAG}"
              exit 1
            fi
          done
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-run of a partially published release: replace the assets in
            # place instead of failing on an existing tag.
            echo "Release ${TAG} already exists; uploading with --clobber."
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "AllSpace $GITHUB_REF_NAME" --generate-notes "${FILES[@]}"
          fi

      - name: Verify the published assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | [.name, .size] | @tsv' > assets.tsv
          echo "Assets on ${TAG}:"
          cat assets.tsv
          missing=0
          for ext in dmg deb AppImage; do
            size="$(awk -F'\t' -v suf=".${ext}" \
              'substr($1, length($1) - length(suf) + 1) == suf { print $2 }' \
              assets.tsv | sort -nr | head -n 1)"
            if [ -z "${size:-}" ] || [ "$size" -le 0 ]; then
              echo "::error::release ${TAG} has no non-empty .${ext} asset"
              missing=1
            else
              echo "ok: .${ext} (${size} bytes)"
            fi
          done
          exit "$missing"
