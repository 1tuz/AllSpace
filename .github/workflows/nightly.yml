name: Nightly

# Heavy checks that are too slow for every PR: the full WebDriver tier (exec +
# port-forward through the real app) and the board interaction/performance
# regression pass. The required PR gates live in ci.yml and are not weakened by
# this workflow; a nightly failure is a signal, not a merge blocker.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full
  cancel-in-progress: false

jobs:
  board-regression:
    name: board regression
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Widget interaction suite (hover, pin, collapse, profile switch)
        run: pnpm --filter @srelens/desktop exec vitest run src/workspace --reporter=verbose
      - name: Bundle size baseline
        run: node --test scripts/perf/size-baseline.test.mjs

  smoke-full:
    name: smoke full (webdriver, exec + port-forward)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.* \
                     /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            build-essential \
            webkit2gtk-driver \
            xvfb
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Build the app binary
        run: cargo build -p srelens-desktop --features custom-protocol --profile ci-smoke
      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: srelens-e2e
      - name: Full smoke suite through the real app
        env:
          SRELENS_E2E_CONTEXT: kind-srelens-e2e
          SRELENS_SMOKE_APP: ${{ github.workspace }}/target/ci-smoke/srelens
          SRELENS_SMOKE_ARTIFACTS: ${{ runner.temp }}/smoke-artifacts
          SRELENS_SMOKE_FULL: "1"
        run: |
          xvfb-run --auto-servernum \
            cargo test -p srelens-desktop --features custom-protocol --profile ci-smoke --test webdriver_smoke -- --ignored --nocapture
      - name: Upload failure artifacts (screenshot + app logs)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-smoke-failure-artifacts
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: ignore
